# Объедини этот файл с %USERPROFILE%\.codex\config.toml.
# Не перезаписывай существующую конфигурацию вслепую.

project_doc_max_bytes = 65536

[features]
multi_agent = true
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_reasoning_effort = "medium"
interrupt_message = true

# Всегда актуальная документация OpenAI/Codex.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# Общая документация библиотек и фреймворков.
[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp@4.0.2"]

# Включать после задания GITHUB_PERSONAL_ACCESS_TOKEN.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"
default_tools_approval_mode = "prompt"
enabled = false
