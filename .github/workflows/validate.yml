name: Validate global DEV

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python tools/validate_dev.py
      - name: Validate Git identity privacy contract
        run: |
          git config user.email "158517930+ZabulaAleksey@users.noreply.github.com"
          python tools/check_git_identity.py
      - name: Run tests
        run: python -m pytest -q
