name: Validate global DEV

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tracked context
        run: python -B tools/validate_context.py
      - name: Run unit and contract tests
        run: python -B -m unittest discover -s tools -p "test_*.py"
      - name: Check Unix installer syntax
        run: bash -n install-global.sh
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw ./install-global.ps1))'
